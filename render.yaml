# ==============================================================================
# SafeSphere Render Infrastructure Blueprint
# ==============================================================================
# NOTE ON THE CURRENT DEPLOYMENT:
#   The live backend (safesphere-backend, free instance) was created manually
#   via the Render dashboard, NOT from this blueprint. Applying this blueprint
#   would create a NEW paid service — it does not sync or manage the existing
#   free-tier service. Keep this file as the paid-tier / IaC reference.
#
# Architecture & Persistent Storage Notes:
# - SafeSphere backend uses SQLite via Node.js built-in `node:sqlite`.
# - Render "starter" plan supports persistent SSD disks (1 GB mounted at /var/data).
# - FREE-TIER PERSISTENCE (current deployment):
#   Free instances have ephemeral containers and no disk support. The backend
#   therefore runs its SQLite DB in-memory (`:memory:`) and keeps it durable via
#   PRIVATE Supabase Storage snapshots (backend/src/data/dbSnapshot.js):
#   hydrate at boot → serialize + upload every 45s (dirty-checked) → final
#   flush on SIGTERM. Configure SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY /
#   SUPABASE_SNAPSHOT_BUCKET to enable. A failed hydrate disables uploads for
#   that process so a fresh empty DB can never overwrite the good snapshot.
# - PostgreSQL Alternative (TODO(DEPLOY)):
#   To scale horizontally to multiple web service instances, migrate the storage
#   layer to managed PostgreSQL (`type: postgres`) and provide DATABASE_URL.
#   Snapshot persistence is single-instance only (same as a persistent disk).
# ==============================================================================

services:
  - type: web
    name: safesphere-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/server.js
    disk:
      name: safesphere-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Free-tier durable snapshots via private Supabase Storage bucket.
      # NOTE: do NOT set DB_PATH in snapshot mode — the live DB must be :memory:.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SNAPSHOT_BUCKET
        value: safesphere-db
